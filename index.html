<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Counter</title>
    <!-- Importing a modern variable font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2 class="title">People Entered</h2>
        <div id="count-ele" class="counter">0</div>
        
        <div class="button-group">
            <button class="btn btn-primary" onclick="increment()">INCREMENT</button>
            <button id="save-btn" class="btn btn-secondary" onclick="save()">SAVE</button>
        </div>

        <div class="history-container">
            <p id="save-ele" class="history-text">Previous entries: </p>
            <button id="clear-save" class="btn-link" onclick="clearsave()">Clear History</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
